# Decap CMS configuration — Clean Air Litigation Database
# Editor auth via DecapBridge (PKCE). Editors are invited by email from the
# DecapBridge dashboard; no GitHub account needed.

backend:
  name: git-gateway
  repo: pierpacanero/r2ca-clean-air-litigation
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/41308a5f-af5b-49db-8c0c-bd8297928fc1/pkce
  auth_token_endpoint: /sites/41308a5f-af5b-49db-8c0c-bd8297928fc1/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://pierpacanero.github.io/r2ca-clean-air-litigation

media_folder: "site/assets/uploads"
public_folder: "assets/uploads"

editor:
  preview: false

collections:
  - name: cases
    label: Cases
    label_singular: Case
    folder: cases
    format: json
    extension: json
    create: true
    delete: true
    identifier_field: name
    slug: "{{fields.slug}}"
    summary: "{{name}} — {{fields.geography.country}} ({{year}})"
    sortable_fields: [name, year]
    fields:
      - label: "URL slug"
        name: slug
        widget: string
        pattern: ["^[a-z0-9-]+$", "Lowercase letters, numbers and hyphens only (e.g. commission-v-italy-pm10-c-644-18)"]
        hint: "Unique identifier used in the entry's web address. Choose it once and do not change it after publication: links and citations depend on it."
      - label: "Case name"
        name: name
        widget: string
        hint: "Case name as it should appear on the site, e.g. 'Commission v Italy (PM10) (C-644/18)'."
      - label: "Year"
        name: year
        widget: number
        value_type: int
        min: 1950
        max: 2100
        hint: "Year of the first decision or procedural step described in the record. Used to sort the list."
      - label: "Date(s)"
        name: date
        widget: string
        hint: "Date(s) of the decision(s) as they should be shown, e.g. '10 November 2020' or '12 July 2017; 10 July 2020 (enforcement)'."
      - label: "Status"
        name: status
        widget: select
        options:
          - "Decided"
          - "Decided — appeal pending"
          - "Decided — merits pending"
          - "Decided — enforcement ongoing"
          - "Pending"
          - "Inadmissible"
      - label: "Geography (country of the facts)"
        name: geography
        widget: object
        fields:
          - label: "Country"
            name: country
            widget: string
            hint: "Country name in English (e.g. Italy, France, United Kingdom). For cases against several States before an international court, the first respondent State."
          - label: "Country code (3 digits)"
            name: iso_n3
            widget: string
            pattern: ["^[0-9]{3}$", "Exactly three digits, e.g. 380 for Italy"]
            hint: "ISO 3166-1 numeric code that links the case to the map. Full list in docs/codici-paesi.md (e.g. Italy 380, France 250, Germany 276, United Kingdom 826, Belgium 056)."
      - label: "Forum (deciding authority)"
        name: jurisdiction
        widget: object
        fields:
          - label: "Type"
            name: type
            widget: select
            options:
              - { label: "Domestic courts", value: "Domestic" }
              - { label: "Court of Justice of the EU", value: "CJEU" }
              - { label: "European Court of Human Rights", value: "ECtHR" }
              - { label: "UN treaty bodies", value: "UN" }
          - label: "Court(s)"
            name: court
            widget: string
            hint: "Free text, e.g. 'Court of Justice of the European Union (Grand Chamber)'."
      - label: "Docket number(s) (optional)"
        name: docket
        widget: string
        required: false
      - label: "Description"
        name: description
        widget: text
        hint: "What the case is about: parties, claims, legal basis."
      - label: "Outcome"
        name: outcome
        widget: text
        hint: "What was decided, and the current state of the proceedings."
      - label: "Topics (optional)"
        name: topics
        widget: list
        required: false
        field: { label: Topic, name: topic, widget: string }
        hint: "Thematic keywords, e.g. PM10, Air quality plans, Enforcement."
      - label: "Sources"
        name: sources
        widget: list
        required: false
        summary: "{{fields.label}}"
        fields:
          - { label: "Citation / label", name: label, widget: string }
          - { label: "URL (optional)", name: url, widget: string, required: false }
